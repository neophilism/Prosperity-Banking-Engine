name: test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: bnk-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATA_MODE: synthetic
      PROSPERITY_ENVIRONMENT: ci-${{ github.run_id }}-${{ github.run_attempt }}
      ENGINE_EPHEMERAL_DIR: ${{ runner.temp }}/prosperity-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check
      - run: npm run check:ci
